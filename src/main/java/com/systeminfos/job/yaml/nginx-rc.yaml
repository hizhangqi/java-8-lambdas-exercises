apiVersion: v1
kind: ReplicationController
metadata:
  name: my-rc
spec:
  replicas: 3  # 确保有3个Pod副本
  selector:
    app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-container
#          image: nginx
          image: harbor.systeminfos.com/library/nginx:1.25.1
          ports:
            - containerPort: 80